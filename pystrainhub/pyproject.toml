[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pystrainhub"
version = "1.0.0"
description = "Python implementation of the StrainHub phylogenetic network toolkit"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Colby T. Ford", email = "colby.ford@uncc.edu" }
]
keywords = [
    "genomics",
    "phylogenetics",
    "infectious-diseases",
    "bioinformatics",
    "transmission-network",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = [
    "biopython>=1.79",
    "networkx>=3.0",
    "pandas>=1.5",
    "numpy>=1.23",
]

[project.optional-dependencies]
visualization = [
    "pyvis>=0.3",
    "folium>=0.14",
]
bayesian = [
    "dendropy>=4.5",
]
all = [
    "pyvis>=0.3",
    "folium>=0.14",
    "dendropy>=4.5",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pyvis>=0.3",
    "folium>=0.14",
    "dendropy>=4.5",
]

[project.urls]
Homepage = "https://github.com/colbyford/StrainHub"
Repository = "https://github.com/colbyford/StrainHub"
"Bug Tracker" = "https://github.com/colbyford/StrainHub/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pystrainhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
